# Production / Dokploy stack: Odoo 18 + PostgreSQL.
#
# This file lives in the odoo-platform SUBMODULE and is consumed from a product
# repo root via the product's thin docker-compose.yml:
#
#   include:
#     - path: platform/docker-compose.yml
#       project_directory: .
#
# => ALL relative paths in this file resolve against the PRODUCT repo root.
#
# Local dev conveniences (published ports, live code mount, reload) live in
# platform/docker-compose.override.yml — the platform Makefile's dev targets
# add it explicitly; Dokploy never sees it.
#
# All tunables come from the product's .env (see its .env.example).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    # Postgres tuning (defaults sized for ~2GB RAM dedicated to Postgres; bump
    # via .env on bigger boxes, e.g. PG_SHARED_BUFFERS=2GB for ~8GB).
    # Rule of thumb: shared_buffers ~= 25% of the RAM given to Postgres,
    # effective_cache_size ~= 50-75%. Scale via .env per deployment.
    command: >
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      -c work_mem=${PG_WORK_MEM:-8MB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
      -c max_connections=${PG_MAX_CONNECTIONS:-100}
    environment:
      POSTGRES_USER: ${DB_USER:-odoo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-odoo}
      POSTGRES_DB: postgres            # maintenance db; Odoo creates ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    # No `ports:` on purpose — prod publishes nothing. To expose Postgres for a
    # one-off remote restore, opt in via docker-compose.dangerously-expose-db.yml
    # (see DEPLOY.md "Dangerously exposed ports"). A `ports:` entry here would
    # publish on EVERY deployment; there is no "off" value for one.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-odoo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    build:
      context: .                       # product repo root
      dockerfile: platform/Dockerfile
      args:
        ODOO_IMAGE: ${ODOO_IMAGE:-odoo:18.0}
        INSTALL_VENDOR_REQS: ${INSTALL_VENDOR_REQS:-1}
        # Apt mirror override for hosts with a bad path to Canonical
        # (e.g. https://mirror.23m.com/ubuntu). Empty = upstream.
        APT_MIRROR: ${APT_MIRROR:-}
    image: ${IMAGE_NAME:-odoo-product}:${IMAGE_TAG:-latest}
    pull_policy: build          # local build image — never try to pull from a registry
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-odoo}
      DB_PASSWORD: ${DB_PASSWORD:-odoo}
      DB_NAME: ${DB_NAME:-False}
      DBFILTER: ${DBFILTER:-}   # host->db routing; multi-db needs (?i)^%d$ (DEPLOY.md)
      LIST_DB: ${LIST_DB:-False}
      ADMIN_PASSWD: ${ADMIN_PASSWD:-admin}
      HTTP_PORT: ${HTTP_PORT:-8069}
      GEVENT_PORT: ${GEVENT_PORT:-8072}
      PROXY_MODE: ${PROXY_MODE:-True}
      WORKERS: ${WORKERS:-2}
      MAX_CRON_THREADS: ${MAX_CRON_THREADS:-1}
      LIMIT_MEMORY_SOFT: ${LIMIT_MEMORY_SOFT:-2147483648}
      LIMIT_MEMORY_HARD: ${LIMIT_MEMORY_HARD:-8589934592}
      LIMIT_REQUEST: ${LIMIT_REQUEST:-1073741824}
      LIMIT_TIME_CPU: ${LIMIT_TIME_CPU:-3600}
      LIMIT_TIME_REAL: ${LIMIT_TIME_REAL:-7200}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Secrets at rest (OCA data_encryption). Generate the key with:
      #   python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # Keep it in a password manager: losing it makes stored secrets unreadable.
      RUNNING_ENV: ${RUNNING_ENV:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      INSTALL_MODULES: ${INSTALL_MODULES:-}
      # Product-specific: set in the product's .env (no platform default).
      UPGRADE_MODULES: ${UPGRADE_MODULES:-}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:-admin}
      UPGRADE_DB: ${UPGRADE_DB:-}
      DEBUG: ${DEBUG:-0}
      DEBUGPY_PORT: ${DEBUGPY_PORT:-5678}
      DEBUGPY_WAIT: ${DEBUGPY_WAIT:-}
      # --- Health probe (see platform/docker/healthcheck.py) ----------------
      # Leave HEALTHCHECK_HOST empty unless multi-db: the probe falls back to
      # DB_NAME, which satisfies a host-routed DBFILTER (%d is just the first
      # label of the Host, never resolved). Only DB_NAME=False needs it set.
      HEALTHCHECK_HOST: ${HEALTHCHECK_HOST:-}
      HEALTHCHECK_PATH: ${HEALTHCHECK_PATH:-/web/manifest.webmanifest}
      HEALTHCHECK_TIMEOUT: ${HEALTHCHECK_TIMEOUT:-10}
      HEALTHCHECK_DISABLE: ${HEALTHCHECK_DISABLE:-}
    volumes:
      - odoo-data:/var/lib/odoo
    expose:
      - "${HTTP_PORT:-8069}"
      - "${GEVENT_PORT:-8072}"
    # Probes a db-requiring (auth='public') route, so a broken registry reports
    # 404 and a broken ORM reports 500 instead of the false 200 that /web/health
    # and /web/login both return. See platform/docker/healthcheck.py for why.
    #
    # start_period must outlast the entrypoint's boot upgrade — failures inside
    # it are not counted, so an upgrade in progress never flaps the container.
    # The `-u all` fallback path can exceed even 5 minutes on a large database;
    # if that is normal for a deployment, raise HEALTHCHECK_START_PERIOD rather
    # than lowering it. Docker's `timeout` must stay above HEALTHCHECK_TIMEOUT
    # (the script's own HTTP timeout) or the script is killed before it answers.
    healthcheck:
      test: ["CMD", "python3", "/usr/local/bin/odoo-healthcheck.py"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: 15s
      retries: ${HEALTHCHECK_RETRIES:-3}
      start_period: ${HEALTHCHECK_START_PERIOD:-300s}
    # No `ports:` on purpose — behind Traefik/nginx the proxy reaches odoo over
    # the docker network. For an inner-VPN box with no proxy, opt in via
    # docker-compose.dangerously-expose-odoo.yml (see DEPLOY.md). A `ports:`
    # entry here would publish on EVERY deployment; there is no "off" value.
    # --- Dokploy / Traefik domain routing ------------------------------------
    # Easiest: leave these off and set the domain in the Dokploy UI
    #   (service: odoo, port: 8069). For workers>0, websockets need a 2nd route.
    # Or drive everything from ${DOMAIN} by uncommenting + joining the Traefik
    # network (see DEPLOY.md):
    #
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.odoo.rule=Host(`${DOMAIN}`)"
    #   - "traefik.http.routers.odoo.entrypoints=websecure"
    #   - "traefik.http.routers.odoo.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.odoo.loadbalancer.server.port=${HTTP_PORT:-8069}"
    #   - "traefik.http.routers.odoo-ws.rule=Host(`${DOMAIN}`) && PathPrefix(`/websocket`)"
    #   - "traefik.http.routers.odoo-ws.entrypoints=websecure"
    #   - "traefik.http.routers.odoo-ws.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.odoo-ws.loadbalancer.server.port=${GEVENT_PORT:-8072}"
    # networks: [default, dokploy-network]
    #
    # Multi-db stack: one router pair per host; with DBFILTER=(?i)^%d$
    # (subdomain == db name, any case) no extra labels are needed. Free-form
    # db names instead need dbfilter_from_header + a per-host headers
    # middleware — see DEPLOY.md "Host -> database routing".

volumes:
  db-data:
  odoo-data:

# Uncomment when wiring Traefik labels above on Dokploy:
# networks:
#   dokploy-network:
#     external: true
